<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awesome Prompts Browser</title>
  <meta name="description" content="A searchable browser for the ai-boost/awesome-prompts curated list of prompts, frameworks, and papers.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪶</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <span class="brand-mark">🪶</span>
        <span class="brand-text">Awesome Prompts <span class="brand-sub">Browser</span></span>
      </a>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="search" placeholder="Search prompts, papers, tools…" autocomplete="off" aria-label="Search">
      </div>
      <a class="source-link" href="https://github.com/ai-boost/awesome-prompts" target="_blank" rel="noopener noreferrer">Source ↗</a>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <p>
      Content curated by <a href="https://github.com/ai-boost/awesome-prompts" target="_blank" rel="noopener noreferrer">ai-boost/awesome-prompts</a>,
      licensed <a href="https://github.com/ai-boost/awesome-prompts/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">GPL-3.0</a>.
      This is an independent, unofficial browser for that list — see <a href="LICENSE" target="_blank" rel="noopener noreferrer">LICENSE</a>.
    </p>
  </footer>

  <div id="modal-root"></div>

  <script src="app.js"></script>
</body>
</html>
